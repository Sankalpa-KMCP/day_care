<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="playhouseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <filter id="yardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14532d" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="450" rx="16" fill="url(#skyGrad)" />

  <!-- Smiling Sun in Sky -->
  <g transform="translate(80, 70)">
    <circle cx="0" cy="0" r="35" fill="#facc15" filter="url(#yardShadow)" />
    <!-- Rays -->
    <line x1="0" y1="-45" x2="0" y2="-55" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="32" y1="-32" x2="40" y2="-40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="45" y1="0" x2="55" y2="0" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="32" y1="32" x2="40" y2="40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="45" x2="0" y2="55" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="-32" y1="32" x2="-40" y2="40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="-45" y1="0" x2="-55" y2="0" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <line x1="-32" y1="-32" x2="-40" y2="-40" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
    <!-- Happy Face -->
    <circle cx="-10" cy="-6" r="3" fill="#854d0e" />
    <circle cx="10" cy="-6" r="3" fill="#854d0e" />
    <path d="M -12 6 Q 0 18 12 6" fill="none" stroke="#854d0e" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Puffy Soft Clouds -->
  <g transform="translate(420, 70)" fill="#ffffff" opacity="0.9">
    <ellipse cx="0" cy="0" rx="35" ry="18" />
    <ellipse cx="25" cy="-8" rx="26" ry="20" />
    <ellipse cx="-20" cy="-4" rx="24" ry="16" />
  </g>

  <!-- Background Wooden Picket Fence -->
  <g transform="translate(0, 180)">
    <rect x="0" y="30" width="600" height="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect x="0" y="60" width="600" height="8" fill="#ffffff" stroke="#e2e8f0" />
    <!-- Fence Posts -->
    <!-- Pattern of pickets -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
      <polygon points="40,10 50,0 60,10 60,80 40,80" />
      <polygon points="90,10 100,0 110,10 110,80 90,80" />
      <polygon points="140,10 150,0 160,10 160,80 140,80" />
      <polygon points="190,10 200,0 210,10 210,80 190,80" />
      <polygon points="240,10 250,0 260,10 260,80 240,80" />
      <polygon points="290,10 300,0 310,10 310,80 290,80" />
      <polygon points="340,10 350,0 360,10 360,80 340,80" />
      <polygon points="390,10 400,0 410,10 410,80 390,80" />
      <polygon points="440,10 450,0 460,10 460,80 440,80" />
      <polygon points="490,10 500,0 510,10 510,80 490,80" />
      <polygon points="540,10 550,0 560,10 560,80 540,80" />
    </g>
  </g>

  <!-- Rolling Lush Green Grass Foreground -->
  <path d="M 0 240 Q 150 210 300 230 T 600 220 L 600 450 L 0 450 Z" fill="url(#grassGrad)" />

  <!-- Left: Wooden Playhouse with Red Roof & Slide -->
  <g transform="translate(130, 160)" filter="url(#yardShadow)">
    <!-- House Body -->
    <rect x="-60" y="40" width="120" height="110" rx="4" fill="url(#playhouseGrad)" stroke="#c2410c" stroke-width="2" />
    <!-- Roof Triangular Red -->
    <polygon points="0,-20 -75,45 75,45" fill="#f43f5e" stroke="#be123c" stroke-width="2" />
    <!-- Small Window with Shutters -->
    <rect x="-40" y="60" width="30" height="30" rx="3" fill="#bae6fd" stroke="#fff" stroke-width="2" />
    <line x1="-25" y1="60" x2="-25" y2="90" stroke="#fff" stroke-width="2" />
    <line x1="-40" y1="75" x2="-10" y2="75" stroke="#fff" stroke-width="2" />
    <!-- Door -->
    <rect x="5" y="75" width="40" height="75" rx="3" fill="#0d9488" />
    <circle cx="15" cy="115" r="3" fill="#facc15" />
    <!-- Yellow Slide going to the left -->
    <path d="M -60 100 Q -100 120 -115 190 L -90 190 Q -80 135 -40 115 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- Right: Wooden Sandbox with Toys -->
  <g transform="translate(430, 290)" filter="url(#yardShadow)">
    <!-- Wooden Box Border -->
    <polygon points="0,0 120,-10 150,50 30,60" fill="#fef08a" stroke="#ca8a04" stroke-width="4" />
    <polygon points="10,5 110,-3 138,45 38,52" fill="#fde047" />
    <!-- Sand Toys (Red Bucket & Blue Shovel) -->
    <polygon points="60,15 75,15 72,35 63,35" fill="#ef4444" />
    <ellipse cx="67" cy="15" rx="8" ry="3" fill="#fca5a5" />
    <!-- Shovel -->
    <line x1="85" y1="20" x2="105" y2="35" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <polygon points="105,35 112,42 100,45" fill="#0284c7" />
  </g>

  <!-- Cheerful Garden Flowers in Grass -->
  <g transform="translate(60, 390)">
    <circle cx="0" cy="0" r="10" fill="#ec4899" />
    <circle cx="0" cy="0" r="4" fill="#fde047" />
  </g>
  <g transform="translate(240, 400)">
    <circle cx="0" cy="0" r="10" fill="#38bdf8" />
    <circle cx="0" cy="0" r="4" fill="#fde047" />
  </g>
  <g transform="translate(540, 380)">
    <circle cx="0" cy="0" r="10" fill="#fb923c" />
    <circle cx="0" cy="0" r="4" fill="#fef08a" />
  </g>

  <!-- Badge Label -->
  <rect x="220" y="390" width="160" height="34" rx="17" fill="#ffffff" filter="url(#yardShadow)" />
  <text x="300" y="412" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#14532d" text-anchor="middle">🌳 Safe Outdoor Play Yard</text>
</svg>
